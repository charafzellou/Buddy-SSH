services:
  backend:
    image: golang:1.26.5-alpine
    working_dir: /workspace
    command: sh -c "cd apps/backend && go mod download && go run ./cmd/buddy-ssh"
    environment:
      BUDDY_SSH_TOKEN: ${BUDDY_SSH_TOKEN:-dev-token-change-me}
      BUDDY_SSH_ALLOWED_ORIGINS: ${BUDDY_SSH_ALLOWED_ORIGINS:-http://localhost:5173}
    ports:
      - "8443:8443"
    volumes:
      - ./:/workspace

  frontend:
    image: oven/bun:1.3.14
    working_dir: /workspace
    command: sh -c "bun install && bun run --filter @buddy-ssh/frontend dev --host 0.0.0.0"
    depends_on:
      - backend
    ports:
      - "5173:5173"
    volumes:
      - ./:/workspace
